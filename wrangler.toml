# Cloudflare deploy configuration (Workers Static Assets).
#
# The connected Git project runs `npx wrangler deploy`, which serves this
# static Astro build as assets-only — no Worker script (`main`), just the
# built `dist/` directory. `npm run build` produces it. See docs/deploy.md.
#
# `name` must match the Worker/project name in the Cloudflare dashboard.
name = "concours-archive"
compatibility_date = "2026-09-18"

[assets]
directory = "./dist"
